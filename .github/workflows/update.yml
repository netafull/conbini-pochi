name: update

on:
  # 姉妹サイト(林檎ポチ等)と同じく、定期実行はGitHubのscheduleを使わず
  # Google Cloud Schedulerからworkflow_dispatch APIを叩く方式にする予定。
  # 理由: GitHub側のscheduleは公称間隔に対し最長12時間超の欠測が実測されて
  # おり(2026-08-25〜29、家電/電書/林檎ポチで確認済み)、workflow_dispatchは
  # その間引きの対象外のため。
  #
  # 発火元: Cloud Scheduler ジョブ conbini-pochi-update(GCPプロジェクト manga-rss /
  #   asia-northeast1、毎朝7時 JST)
  #   1日1回で足りる(公式サイトの新商品掲載は日次更新のため、30分間隔の
  #   林檎ポチのような即時性は不要)。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # セブンは6秒、他は3秒間隔で1日ぶんの新商品(3社合計で数百件規模になりうる)
    # を取得するため、時間には余裕を持たせる
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: 新商品を取得
        run: python3 scripts/crawl.py

      - name: ネタフルのレビュー記事を取得・照合
        # ネタフル側の失敗はサイト更新全体を止めない(スクリプト内でエラーを
        # 記録するだけで常に正常終了する)
        run: python3 scripts/fetch_netaful_reviews.py

      - name: サイトを生成
        run: python3 scripts/generate_site.py

      - name: コミットしてプッシュ
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "変更なし"
            exit 0
          fi
          git add -A
          # コンフリクトマーカーが混入したままコミットされる事故が既存サイトで
          # 起きているため、push前に必ず確認する
          if git grep -qE '^(<<<<<<<|>>>>>>>)' -- data/ docs/; then
            echo "::error::コンフリクトマーカーを検出したため中止します"
            exit 1
          fi
          git commit -m "新商品情報を更新 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: 新商品を通知
        if: success()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/notify.py --summary

      - name: 失敗を通知
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/notify.py --failure
